version: '3.8'

services:
    rabbitmq:
        image: rabbitmq:4.1.0-management
        container_name: my-rabbitmq
        ports:
            - '127.0.0.1:5672:5672'
            - '127.0.0.1:15672:15672'
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq/
        environment:
            - RABBITMQ_DEFAULT_USER=guest
            - RABBITMQ_DEFAULT_PASS=guest
        networks:
            - dev_network

    postgres:
        image: postgres:17.5-alpine
        container_name: my-postgres
        ports:
            - '127.0.0.1:5432:5432'
        environment:
            - POSTGRES_USER=eldon
            - POSTGRES_PASSWORD=eldon
            - POSTGRES_DB=eldon
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - dev_network

    redis:
        image: redis:7.4-alpine
        container_name: my-redis
        ports:
            - '127.0.0.1:6379:6379'
        volumes:
            - redis_data:/data
        # Match prod hardening so dev surfaces config issues before deploy:
        # - bind localhost-only via the published port (network: dev_network)
        # - cap memory and evict cold keys to protect the host
        # - disable RDB + AOF; rate-limit counters and pub/sub channels are
        #   recoverable on restart, so persistence is wasted I/O for now.
        command:
            - redis-server
            - --maxmemory
            - 512mb
            - --maxmemory-policy
            - allkeys-lru
            - --save
            - ''
            - --appendonly
            - 'no'
        networks:
            - dev_network

    # S3-compatible object store for EldonFileStore. Same dev/prod-parity
    # rationale as redis/rabbitmq: run the real protocol locally so storage bugs
    # surface before deploy. The companion `createbuckets` step provisions the
    # dev and test buckets MinIO does not auto-create.
    minio:
        # Pin the object-store image for reproducible dev/test behavior. Avoid
        # `latest`; storage compatibility changes should be deliberate.
        image: minio/minio:RELEASE.2025-09-07T16-13-09Z
        container_name: my-minio
        ports:
            - '127.0.0.1:9000:9000'
            - '127.0.0.1:9001:9001'
        volumes:
            - minio_data:/data
        environment:
            - MINIO_ROOT_USER=minioadmin
            - MINIO_ROOT_PASSWORD=minioadmin
        command: server /data --console-address ":9001"
        healthcheck:
            test: ['CMD', 'mc', 'ready', 'local']
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - dev_network

    createbuckets:
        image: minio/mc:RELEASE.2025-08-13T08-35-41Z
        container_name: my-minio-createbuckets
        depends_on:
            minio:
                condition: service_healthy
        entrypoint: >
            /bin/sh -c " mc alias set local http://minio:9000 minioadmin minioadmin; mc mb --ignore-existing
            local/eldon-dev; mc mb --ignore-existing local/eldon-test; mc anonymous set download local/eldon-dev; mc
            anonymous set download local/eldon-test; exit 0; "
        networks:
            - dev_network

volumes:
    rabbitmq_data:
    postgres_data:
    redis_data:
    minio_data:

networks:
    dev_network:
        driver: bridge
