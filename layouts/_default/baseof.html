<!doctype html>
<html lang="{{ site.Language.LanguageCode }}">
<head>{{ partial "head.html" . }}</head>
<body class="kind-{{ .Kind }} section-{{ .Section }}">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="shell">
    {{ partial "header.html" . }}
    <main id="main">{{ block "main" . }}{{ end }}</main>
    {{ partial "footer.html" . }}
  </div>
  {{ $script := resources.Get "js/main.js" | minify | fingerprint }}<script src="{{ $script.RelPermalink }}" integrity="{{ $script.Data.Integrity }}" defer></script>
  {{ with .Resources.GetMatch "*.js" }}{{ $pageScript := . | minify | fingerprint }}<script src="{{ $pageScript.RelPermalink }}" integrity="{{ $pageScript.Data.Integrity }}" defer></script>{{ end }}
</body>
</html>
