{{ define "main" }}
<article class="article">
  <header class="article-header">
    <p class="eyebrow">{{ if eq .Section "posts" }}{{ .Date.Format "2 January 2006" }}{{ else if eq .Section "experiments" }}Interactive essay{{ else }}Evergreen page{{ end }}</p>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="dek">{{ . }}</p>{{ end }}
  </header>
  <div class="prose">{{ .Content }}</div>
</article>
{{ end }}
